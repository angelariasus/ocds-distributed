name: ocds

x-kafka: &kafka
  image: apache/kafka:4.1.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set in .env}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-garage: &garage
  image: dxflrs/garage:v2.1.0
  restart: unless-stopped
  environment:
    GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in .env}
    GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set in .env}
  networks:
    default:
      aliases: [garage]

x-catalog: &catalog
  image: ocds-catalog
  build: ./services/catalog
  restart: unless-stopped
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    DATA_DIR: /data
    SEEDS: catalog1=catalog1:7100,catalog2=catalog2:7100,catalog3=catalog3:7100
    REPLICATION_N: ${CATALOG_N:-3}
    READ_QUORUM_R: ${CATALOG_R:-2}
    WRITE_QUORUM_W: ${CATALOG_W:-2}
    ANTI_ENTROPY_INTERVAL: ${CATALOG_ANTI_ENTROPY_INTERVAL:-30s}
    SUSPECT_TIMEOUT: ${CATALOG_SUSPECT_TIMEOUT:-10s}

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

services:
  kafka1:
    <<: *kafka
    hostname: kafka1
    ports: ["19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:19092
    volumes: [kafka1:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    hostname: kafka2
    ports: ["19093:19093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:19093
    volumes: [kafka2:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    hostname: kafka3
    ports: ["19094:19094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:19094
    volumes: [kafka3:/var/lib/kafka/data]

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes:
      - ./deploy/kafka/create-topics.sh:/init/create-topics.sh:ro

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ocds
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  garage1:
    <<: *garage
    hostname: garage1
    ports: ["3900:3900"]
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage1:/var/lib/garage

  garage2:
    <<: *garage
    hostname: garage2
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage2:/var/lib/garage

  garage3:
    <<: *garage
    hostname: garage3
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage3:/var/lib/garage

  garage4:
    <<: *garage
    hostname: garage4
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage4:/var/lib/garage

  garage-init:
    image: python:3.12-slim
    depends_on: [garage1, garage2, garage3, garage4]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_NODES: garage1,garage2,garage3,garage4
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_BUCKET: ${S3_BUCKET:-bronze}
    command: ["python", "-I", "/init/init.py"]
    volumes:
      - ./deploy/garage/init.py:/init/init.py:ro

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.6.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro

  catalog1:
    <<: *catalog
    hostname: catalog1
    volumes:
      - catalog1:/data

  catalog2:
    <<: *catalog
    hostname: catalog2
    volumes:
      - catalog2:/data

  catalog3:
    <<: *catalog
    hostname: catalog3
    volumes:
      - catalog3:/data

  catalog4:
    <<: *catalog
    hostname: catalog4
    volumes:
      - catalog4:/data

  catalog5:
    <<: *catalog
    hostname: catalog5
    volumes:
      - catalog5:/data

  compiler:
    build: ./services/compiler
    deploy:
      replicas: ${COMPILER_REPLICAS:-2}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      <<: *otel-env
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092

  limiter:
    build: ./services/limiter
    environment:
      <<: *otel-env
      LIMITER_INITIAL_RATE: ${LIMITER_INITIAL_RATE:-2}
      LIMITER_MIN_RATE: ${LIMITER_MIN_RATE:-1}
      LIMITER_MAX_RATE: ${LIMITER_MAX_RATE:-20}
      LIMITER_LATENCY_HIGH: ${LIMITER_LATENCY_HIGH:-3s}
      LIMITER_LATENCY_LOW: ${LIMITER_LATENCY_LOW:-1500ms}

  ocds-mock:
    build: ./services/ocds-mock
    profiles: [sim]
    environment:
      DATA_DIR: /data
      PUBLIC_URL: http://toxiproxy:8081
      BASE_LATENCY: ${MOCK_BASE_LATENCY:-300ms}
      PER_INFLIGHT_LATENCY: ${MOCK_PER_INFLIGHT_LATENCY:-400ms}
      THROTTLE_ABOVE: ${MOCK_THROTTLE_ABOVE:-0}
    volumes:
      - ./data/sample:/data:ro

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [sim]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports: ["8474:8474", "8081:8081"]
    volumes:
      - ./deploy/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on: [ocds-mock]

  coordinator:
    build: ./services/coordinator
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      <<: *otel-env
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      OCDS_BASE_URL: ${OCDS_BASE_URL:-https://contratacionesabiertas.oece.gob.pe/api/v1}
      PLAN_SOURCES: ${PLAN_SOURCES:-seace_v3}
      PLAN_FROM: ${PLAN_FROM:-2026-08}
      PLAN_TO: ${PLAN_TO:-2026-09}
      PLAN_INTERVAL: ${PLAN_INTERVAL:-6h}
      PLAN_API_SOURCES: ${PLAN_API_SOURCES:-}
      PLAN_API_PREFIX_LEN: ${PLAN_API_PREFIX_LEN:-0}
      PLAN_API_PREFIXES: ${PLAN_API_PREFIXES:-}

  extractor:
    build: ./services/extractor
    deploy:
      replicas: ${EXTRACTOR_REPLICAS:-3}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      garage-init: { condition: service_completed_successfully }
      limiter: { condition: service_started }
      catalog1: { condition: service_started }
    environment:
      <<: *otel-env
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      OCDS_BASE_URL: ${OCDS_BASE_URL:-https://contratacionesabiertas.oece.gob.pe/api/v1}
      LIMITER_ADDR: limiter:7000
      CATALOG_ADDRS: catalog1:7100,catalog2:7100,catalog3:7100,catalog4:7100,catalog5:7100
      OBSERVATIONS_TOPIC: bronze.records
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-bronze}

volumes:
  catalog1:
  catalog2:
  catalog3:
  catalog4:
  catalog5:
  kafka1:
  kafka2:
  kafka3:
  garage1:
  garage2:
  garage3:
  garage4:
