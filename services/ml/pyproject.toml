[project]
name = "ocds-mlserve"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "grpcio>=1.70",
    "grpcio-health-checking>=1.70",
    "joblib>=1.4",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "protobuf>=5.29",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlserve", "src/ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
extend-exclude = ["src/ml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
