[project]
name = "ocds-extractor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "confluent-kafka>=2.6",
    "grpcio>=1.70",
    "protobuf>=5.29",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-sdk>=1.28",
    "prometheus-client>=0.21",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor", "src/limiter", "src/catalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/limiter", "src/catalog"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
