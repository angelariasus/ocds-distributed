[project]
name = "ocds-gold"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "confluent-kafka>=2.6",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gold"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
