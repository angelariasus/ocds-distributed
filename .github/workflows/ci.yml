name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coordinator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/coordinator/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  extractor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  images:
    runs-on: ubuntu-latest
    needs: [coordinator, extractor]
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/coordinator
      - run: docker build services/extractor
