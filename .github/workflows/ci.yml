name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [coordinator, limiter, ocds-mock, catalog, compiler, api, ledger]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [extractor, gold, ml]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  silver:
    runs-on: ubuntu-latest
    container:
      image: apache/spark:4.0.1-python3
      options: --user root
    defaults:
      run:
        working-directory: services/silver
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest ruff
      - run: ruff check . && ruff format --check .
      - run: PYTHONPATH=/opt/spark/python:$(ls /opt/spark/python/lib/py4j-*.zip):src pytest

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/gen_proto.sh
      - run: git diff --exit-code -- services/limiter/gen services/catalog/gen services/api/gen services/extractor/src/limiter services/extractor/src/catalog services/ml/src/ml

  images:
    runs-on: ubuntu-latest
    needs: [go, python, silver]
    strategy:
      matrix:
        service: [coordinator, limiter, ocds-mock, catalog, compiler, extractor, silver, gold, ml, api, ledger]
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/${{ matrix.service }}
