name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [coordinator, limiter, ocds-mock, catalog, compiler]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  extractor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/gen_proto.sh
      - run: git diff --exit-code -- services/limiter/gen services/catalog/gen services/extractor/src/limiter services/extractor/src/catalog

  images:
    runs-on: ubuntu-latest
    needs: [go, extractor]
    strategy:
      matrix:
        service: [coordinator, limiter, ocds-mock, catalog, compiler, extractor]
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/${{ matrix.service }}
