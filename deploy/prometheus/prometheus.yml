global:
  scrape_interval: 10s

scrape_configs:
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator1:2112", "coordinator2:2112", "coordinator3:2112"]

  - job_name: extractor
    dns_sd_configs:
      - names: ["extractor"]
        type: A
        port: 8000

  - job_name: limiter
    static_configs:
      - targets: ["limiter:2113"]

  - job_name: ocds-mock
    static_configs:
      - targets: ["ocds-mock:8080"]

  - job_name: compiler
    dns_sd_configs:
      - names: ["compiler"]
        type: A
        port: 2115

  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 2116

  - job_name: ml
    dns_sd_configs:
      - names: ["ml"]
        type: A
        port: 8000

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]

  - job_name: ledger
    static_configs:
      - targets: ["ledger:8100"]

  - job_name: catalog
    static_configs:
      - targets: ["catalog1:2114", "catalog2:2114", "catalog3:2114", "catalog4:2114", "catalog5:2114"]

  - job_name: garage
    static_configs:
      - targets: ["garage1:3903", "garage2:3903", "garage3:3903", "garage4:3903"]
