global:
  scrape_interval: 10s

scrape_configs:
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:2112"]

  - job_name: extractor
    dns_sd_configs:
      - names: ["extractor"]
        type: A
        port: 8000

  - job_name: garage
    static_configs:
      - targets: ["garage1:3903", "garage2:3903", "garage3:3903", "garage4:3903"]
