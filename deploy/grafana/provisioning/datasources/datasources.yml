apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686

  - name: Gold (PostgreSQL replicas)
    uid: gold
    type: grafana-postgresql-datasource
    url: haproxy:5001
    user: postgres
    secureJsonData:
      password: $PG_SUPERUSER_PASSWORD
    jsonData:
      database: postgres
      sslmode: require
      postgresVersion: 1600
