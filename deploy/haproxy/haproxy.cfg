global
    maxconn 200

defaults
    mode tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m

# Patroni answers 200 on /primary only on the current leader and on /replica only on
# healthy standbys, so the health check is what routes each port.
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
